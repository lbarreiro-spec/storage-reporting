<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HubSpot Data — AnyVan Storage</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --mono:'SF Mono','Menlo','Monaco',monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
}
html,body{height:100%;font-family:var(--sans);background:#f6f7ed;overflow:hidden}
body{display:flex}

.sidebar{
  width:220px;min-width:220px;background:#1f1f1f;
  display:flex;flex-direction:column;
  padding:24px 0;flex-shrink:0;height:100vh;z-index:100;overflow-y:auto;
}
.sidebar-brand{padding:0 24px 28px}
.sidebar-label{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,0.5);margin-bottom:4px}
.sidebar-title{font-size:16px;font-weight:600;color:#fff}
.nav-link{
  display:block;padding:10px 24px;font-size:13px;color:rgba(255,255,255,0.65);
  text-decoration:none;transition:color .12s,background .12s;border-left:3px solid transparent;
}
.nav-link:hover{color:rgba(255,255,255,0.85)}
.nav-link.active{color:#fff;border-left-color:#fff;background:rgba(255,255,255,0.06)}
.sidebar-bottom{margin-top:auto;padding:16px 24px;border-top:1px solid rgba(255,255,255,0.08)}
.sidebar-home{font-size:13px;color:rgba(255,255,255,0.65);text-decoration:none;transition:color .12s}
.sidebar-home:hover{color:#fff}

.main-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#f6f7ed}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 24px;border-bottom:1px solid #e2e2e2;background:#fff;flex-shrink:0;z-index:30;
}
.topbar-title{font-size:15px;font-weight:600;color:#111827;letter-spacing:-.01em}
.topbar-right{display:flex;align-items:center;gap:10px}
.topbar-meta{font-size:13px;color:#6b7280;font-family:var(--mono)}

.refresh-btn{
  background:#fff;border:1px solid #e2e2e2;border-radius:8px;padding:6px 14px;
  font-family:var(--sans);font-size:14px;color:#6b7280;cursor:pointer;transition:all .12s;
}
.refresh-btn:hover:not(:disabled){border-color:#1f1f1f;color:#1f1f1f}
.refresh-btn:disabled{opacity:0.5;cursor:default}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.content{flex:1;overflow-y:auto;padding:28px 32px;position:relative}

.section-hdr{
  font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#6b7280;
  border-bottom:1px solid #e2e2e2;padding-bottom:8px;margin-bottom:16px;
}
.section-gap{height:36px}

/* shared table base */
table{border-collapse:collapse;white-space:nowrap;font-size:13px}
thead th{
  background:#f4f4f4;border-bottom:2px solid #e2e2e2;
  padding:10px 16px;font-size:11px;font-weight:600;
  color:#6b7280;letter-spacing:.08em;text-transform:uppercase;text-align:left;
}
thead th.r{text-align:right}
tbody tr{border-bottom:1px solid #f0f0f0}
tbody tr:hover td{background:#fafafa !important}
tbody tr.latest td{background:#fffbeb}
tbody tr.latest:hover td{background:#fef3c7 !important}

/* scroll wrapper */
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* shared table cells */
.metric-h{min-width:160px;width:160px}
.metric-lbl{padding:12px 16px;background:#fff;color:#374151;font-size:13px;font-weight:500;white-space:nowrap;border-right:2px solid #e2e2e2}
.agent-lbl{font-size:14px;font-weight:600;color:#111827}
thead th.wk-col{min-width:120px;text-align:center;white-space:normal;line-height:1.3}
thead th.wk-col.latest{background:#fffbeb;border-bottom-color:#f59e0b}

/* overview table */
.ov-table{margin-bottom:0}
.ov-table td{padding:12px 16px;background:#fff;vertical-align:middle}
.ov-table td.num{font-family:var(--mono);font-size:14px;font-weight:500;color:#111827;text-align:center}
.ov-table td.pct{font-family:var(--mono);font-size:13px;text-align:center}
.ov-table td.latest-col{background:#fffbeb}
.ov-table tr:hover td{background:#fafafa !important}
.ov-table tr:hover td.latest-col{background:#fef3c7 !important}

/* agent table */
.ag-table{margin-bottom:0}
.ag-table thead th{min-width:130px}
.ag-table td{padding:12px 16px;background:#fff;vertical-align:middle;text-align:center}
.ag-table td.latest-col{background:#fffbeb}
.ag-table tr:hover td{background:#fafafa !important}
.ag-table tr:hover td.latest-col{background:#fef3c7 !important}

/* agent left-side label */
.agent-lbl{
  text-align:left !important;
  padding-left:20px !important;
  border-left:3px solid #e2e2e2;
}
.ag-table tbody tr:nth-child(1) .agent-lbl{border-left-color:#6366f1}
.ag-table tbody tr:nth-child(2) .agent-lbl{border-left-color:#f59e0b}
.ag-table tbody tr:nth-child(3) .agent-lbl{border-left-color:#10b981}
.ag-table tbody tr:nth-child(4) .agent-lbl{border-left-color:#ef4444}
.ag-table tbody tr:nth-child(5) .agent-lbl{border-left-color:#3b82f6}
.ag-table tbody tr:nth-child(6) .agent-lbl{border-left-color:#9ca3af}

/* cell values */
.ac-lc{font-family:var(--mono);font-size:16px;font-weight:600;color:#111827}
.ac-lc-lbl{font-size:10px;color:#9ca3af;letter-spacing:.05em;text-transform:uppercase;margin-top:1px}
.ac-div{height:8px}
.ac-lns{font-family:var(--mono);font-size:14px;font-weight:500;color:#9ca3af}
.ac-lns.good{color:#16a34a}
.ac-lns.warn{color:#d97706}
.ac-lns.bad{color:#dc2626}
.ac-lns-lbl{font-size:10px;letter-spacing:.05em;text-transform:uppercase;margin-top:1px;color:inherit}

/* shared */
.pct.good{color:#16a34a}
.pct.warn{color:#d97706}
.pct.bad{color:#dc2626}

.state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#6b7280}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#e2e2e2;border-radius:2px}
</style>
</head>
<body>

<nav class="sidebar">
  <div class="sidebar-brand">
    <div class="sidebar-label">AnyVan Storage</div>
    <div class="sidebar-title">Reporting</div>
  </div>
  <a class="nav-link" href="mtd.html">MTD Revenue</a>
  <a class="nav-link" href="monthly.html">Monthly Trends</a>
  <a class="nav-link" href="weekly.html">Weekly Revenue</a>
  <a class="nav-link" href="daily.html">Daily Activity</a>
  <a class="nav-link" href="voice.html">Voice Activity</a>
  <a class="nav-link" href="whatsapp.html">WhatsApp</a>
  <a class="nav-link" href="freshdesk.html">Freshdesk</a>
  <a class="nav-link" href="csat.html">CSAT &amp; NPS</a>
  <a class="nav-link" href="debt.html">Debt Intelligence</a>
  <a class="nav-link" href="clearpass.html">Supplier Invoice Automation</a>
  <a class="nav-link" href="rcs.html">RCS Driver Messaging</a>
  <a class="nav-link active" href="hs_data.html">HubSpot Data</a>
  <div class="sidebar-bottom">
    <a class="sidebar-home" href="../index.html">← Home</a>
  </div>
</nav>

<div class="main-wrap">
<div class="topbar">
  <span class="topbar-title">HubSpot Data</span>
  <div class="topbar-right">
    <span class="topbar-meta" id="meta"></span>
    <button class="refresh-btn" id="refresh-btn" onclick="triggerRefresh()">↻ Refresh</button>
  </div>
</div>

<div class="content" id="content">
  <div class="state" id="state">Loading…</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL  = '[SUPABASE_URL_REMOVED]'
const SUPABASE_ANON = '[SUPABASE_ANON_KEY_REMOVED]'
const db            = supabase.createClient(SUPABASE_URL, SUPABASE_ANON)
const GITHUB_REPO   = 'Robbosd/storage-reporting'
const WORKFLOW_ID   = 'fetch_hs_data.yml'
const AGENTS        = ['Dylan','Andy','Prosper','Carla','Michelle','Other']
const MO            = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']

let TEAM_DATA  = []
let AGENT_DATA = {}  // { 'YYYY-MM-DD': { Dylan: {lc,lns}, ... } }

function weekLabel(isoSat) {
  const sat = new Date(isoSat + 'T00:00:00')
  const fri = new Date(sat); fri.setDate(fri.getDate() + 6)
  const fmt = d => `${d.getDate()} ${MO[d.getMonth()]}`
  const yearSuffix = sat.getFullYear() !== new Date().getFullYear() ? ` ${sat.getFullYear()}` : ''
  return `${fmt(sat)} – ${fmt(fri)}${yearSuffix}`
}

function fmtN(n) { return n != null ? Number(n).toLocaleString('en-GB') : '—' }

function pctClass(pct) {
  if (pct == null) return ''
  if (pct < 5)    return 'good'
  if (pct < 15)   return 'warn'
  return 'bad'
}


function render() {
  const content = document.getElementById('content')
  if (!TEAM_DATA.length) {
    content.innerHTML = '<div class="state">No data yet — click Refresh to populate</div>'
    return
  }

  // Week column headers (most recent = index 0 = leftmost)
  const weekHeaders = TEAM_DATA.map((r, i) =>
    `<th class="wk-col${i===0?' latest':''}">${weekLabel(r.week_commencing)}</th>`
  ).join('')

  // ── Team overview (transposed: rows = metrics, cols = weeks) ────
  const lcCells  = TEAM_DATA.map((r, i) =>
    `<td class="num${i===0?' latest-col':''}">${fmtN(r.leads_created)}</td>`
  ).join('')
  const lnsCells = TEAM_DATA.map((r, i) =>
    `<td class="num${i===0?' latest-col':''}">${fmtN(r.leads_in_new_stage)}</td>`
  ).join('')
  const pctCells = TEAM_DATA.map((r, i) => {
    const pct = r.leads_created ? r.leads_in_new_stage / r.leads_created * 100 : null
    return `<td class="pct ${pctClass(pct)}${i===0?' latest-col':''}">${pct!=null ? pct.toFixed(1)+'%' : '—'}</td>`
  }).join('')

  // ── Agent breakdown (transposed: rows = agents, cols = weeks) ───
  const agentRows = AGENTS.map(a => {
    const cells = TEAM_DATA.map((r, i) => {
      const d   = (AGENT_DATA[r.week_commencing] || {})[a] || {}
      const lc  = d.lc  ?? null
      const lns = d.lns ?? null
      const pct = (lc && lns != null) ? lns / lc * 100 : null
      const cls = pctClass(pct)
      return `<td class="${i===0?'latest-col':''}">
        <div class="ac-lc">${lc != null ? fmtN(lc) : '—'}</div>
        <div class="ac-lc-lbl">created</div>
        <div class="ac-div"></div>
        <div class="ac-lns ${cls}">${lns != null ? fmtN(lns) : '—'}</div>
        <div class="ac-lns-lbl ${cls}">${pct != null ? 'untouched · '+pct.toFixed(0)+'%' : 'untouched'}</div>
      </td>`
    }).join('')
    return `<tr><td class="metric-lbl agent-lbl">${a}</td>${cells}</tr>`
  }).join('')

  content.innerHTML = `
    <div class="section-hdr">Team Overview</div>
    <div class="tbl-scroll">
    <table class="ov-table">
      <thead><tr>
        <th class="metric-h"></th>
        ${weekHeaders}
      </tr></thead>
      <tbody>
        <tr><td class="metric-lbl">Leads Created</td>${lcCells}</tr>
        <tr><td class="metric-lbl">Still in New Stage</td>${lnsCells}</tr>
        <tr><td class="metric-lbl">% Untouched</td>${pctCells}</tr>
      </tbody>
    </table>
    </div>

    <div class="section-gap"></div>

    <div class="section-hdr">Agent Breakdown</div>
    <div class="tbl-scroll">
    <table class="ag-table">
      <thead><tr>
        <th class="metric-h"></th>
        ${weekHeaders}
      </tr></thead>
      <tbody>${agentRows}</tbody>
    </table>
    </div>

    <div style="height:32px"></div>
  `

  const updated = TEAM_DATA[0]?.updated_at
  document.getElementById('meta').textContent = updated
    ? `Updated ${new Date(updated).toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'})}`
    : ''
}

async function loadData() {
  const [teamRes, agentRes] = await Promise.all([
    db.from('hs_weekly_stats')
      .select('week_commencing,leads_created,leads_in_new_stage,updated_at')
      .order('week_commencing', { ascending: false }),
    db.from('hs_agent_weekly_stats')
      .select('week_commencing,agent,leads_created,leads_in_new_stage')
      .order('week_commencing', { ascending: false })
  ])
  if (teamRes.error) throw teamRes.error
  TEAM_DATA = teamRes.data || []

  AGENT_DATA = {}
  for (const row of (agentRes.data || [])) {
    if (!AGENT_DATA[row.week_commencing]) AGENT_DATA[row.week_commencing] = {}
    AGENT_DATA[row.week_commencing][row.agent] = { lc: row.leads_created, lns: row.leads_in_new_stage }
  }
}

async function init() {
  try { await loadData() } catch(e) {
    document.getElementById('state').textContent = 'Failed to load data'
    return
  }
  const st = document.getElementById('state')
  if (st) st.remove()
  render()
}

async function triggerRefresh() {
  const btn = document.getElementById('refresh-btn')
  btn.disabled = true
  btn.innerHTML = '<span class="spin">↻</span> Refreshing…'
  try {
    const dispatch = await fetch(
      `https://storage-dispatch.scottrobinson92.workers.dev/repos/${GITHUB_REPO}/actions/workflows/${WORKFLOW_ID}/dispatches`,
      { method:'POST', headers:{'Authorization':'Bearer worker-handles-auth','Accept':'application/vnd.github.v3+json','Content-Type':'application/json'}, body:JSON.stringify({ref:'main'}) }
    )
    if (!dispatch.ok) throw new Error(`Dispatch failed: ${dispatch.status}`)
    await new Promise(r => setTimeout(r, 5000))
    let runId = null
    for (let i = 0; i < 12; i++) {
      const runs = await fetch(
        `https://storage-dispatch.scottrobinson92.workers.dev/repos/${GITHUB_REPO}/actions/workflows/${WORKFLOW_ID}/runs?per_page=1`,
        { headers:{'Authorization':'Bearer worker-handles-auth','Accept':'application/vnd.github.v3+json'} }
      )
      const d = await runs.json()
      if (d.workflow_runs?.[0]) { runId = d.workflow_runs[0].id; break }
      await new Promise(r => setTimeout(r, 3000))
    }
    if (!runId) throw new Error('Could not find workflow run')
    for (let i = 0; i < 50; i++) {
      await new Promise(r => setTimeout(r, 6000))
      const check = await fetch(
        `https://storage-dispatch.scottrobinson92.workers.dev/repos/${GITHUB_REPO}/actions/runs/${runId}`,
        { headers:{'Authorization':'Bearer worker-handles-auth','Accept':'application/vnd.github.v3+json'} }
      )
      const run = await check.json()
      if (run.status === 'completed') {
        if (run.conclusion !== 'success') throw new Error(`Workflow ${run.conclusion}`)
        break
      }
    }
    await loadData()
    render()
  } catch(e) {
    alert('Refresh failed: ' + e.message)
    console.error(e)
  } finally {
    btn.disabled = false
    btn.innerHTML = '↻ Refresh'
  }
}

init()
</script>
</body>
</html>
