<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HubSpot Data — AnyVan Storage</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --mono:'SF Mono','Menlo','Monaco',monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
}
html,body{height:100%;font-family:var(--sans);background:#f6f7ed;overflow:hidden}
body{display:flex}

.sidebar{
  width:220px;min-width:220px;background:#1f1f1f;
  display:flex;flex-direction:column;
  padding:24px 0;flex-shrink:0;height:100vh;z-index:100;overflow-y:auto;
}
.sidebar-brand{padding:0 24px 28px}
.sidebar-label{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,0.5);margin-bottom:4px}
.sidebar-title{font-size:16px;font-weight:600;color:#fff}
.nav-link{
  display:block;padding:10px 24px;font-size:13px;color:rgba(255,255,255,0.65);
  text-decoration:none;transition:color .12s,background .12s;border-left:3px solid transparent;
}
.nav-link:hover{color:rgba(255,255,255,0.85)}
.nav-link.active{color:#fff;border-left-color:#fff;background:rgba(255,255,255,0.06)}
.sidebar-bottom{margin-top:auto;padding:16px 24px;border-top:1px solid rgba(255,255,255,0.08)}
.sidebar-home{font-size:13px;color:rgba(255,255,255,0.65);text-decoration:none;transition:color .12s}
.sidebar-home:hover{color:#fff}

.main-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#f6f7ed}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 24px;border-bottom:1px solid #e2e2e2;background:#fff;flex-shrink:0;z-index:30;
}
.topbar-title{font-size:15px;font-weight:600;color:#111827;letter-spacing:-.01em}
.topbar-right{display:flex;align-items:center;gap:10px}
.topbar-meta{font-size:13px;color:#6b7280;font-family:var(--mono)}

.refresh-btn{
  background:#fff;border:1px solid #e2e2e2;border-radius:8px;padding:6px 14px;
  font-family:var(--sans);font-size:14px;color:#6b7280;cursor:pointer;transition:all .12s;
}
.refresh-btn:hover:not(:disabled){border-color:#1f1f1f;color:#1f1f1f}
.refresh-btn:disabled{opacity:0.5;cursor:default}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.matrix-wrap{flex:1;overflow:auto;position:relative}

table{border-collapse:collapse;white-space:nowrap;font-size:13px;width:100%}

thead th{
  position:sticky;top:0;z-index:20;
  background:#f4f4f4;border-bottom:2px solid #e2e2e2;
  padding:10px 20px;font-size:11px;font-weight:600;
  color:#6b7280;letter-spacing:.08em;text-transform:uppercase;
  text-align:left;
}
thead th.r{text-align:right}

tbody tr{border-bottom:1px solid #f0f0f0}
tbody tr:hover td{background:#fafafa}
tbody tr.latest td{background:#fffbeb}
tbody tr.latest:hover td{background:#fef3c7}

td{padding:12px 20px;color:#374151;background:#fff;vertical-align:middle}
td.week-cell{font-size:13px;color:#111827;font-weight:500;min-width:160px}
td.num{font-family:var(--mono);font-size:14px;font-weight:500;color:#111827;text-align:right}
td.pct{font-family:var(--mono);font-size:13px;text-align:right}
td.pct.good{color:#16a34a}
td.pct.warn{color:#d97706}
td.pct.bad{color:#dc2626}

.week-lbl{font-size:13px;color:#111827}
.week-sub{font-size:11px;color:#9ca3af;margin-top:2px}

.state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#6b7280}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#e2e2e2;border-radius:2px}
</style>
</head>
<body>

<nav class="sidebar">
  <div class="sidebar-brand">
    <div class="sidebar-label">AnyVan Storage</div>
    <div class="sidebar-title">Reporting</div>
  </div>
  <a class="nav-link" href="mtd.html">MTD Revenue</a>
  <a class="nav-link" href="monthly.html">Monthly Trends</a>
  <a class="nav-link" href="weekly.html">Weekly Revenue</a>
  <a class="nav-link" href="daily.html">Daily Activity</a>
  <a class="nav-link" href="voice.html">Voice Activity</a>
  <a class="nav-link" href="whatsapp.html">WhatsApp</a>
  <a class="nav-link" href="freshdesk.html">Freshdesk</a>
  <a class="nav-link" href="csat.html">CSAT &amp; NPS</a>
  <a class="nav-link" href="debt.html">Debt Intelligence</a>
  <a class="nav-link" href="clearpass.html">Supplier Invoice Automation</a>
  <a class="nav-link" href="rcs.html">RCS Driver Messaging</a>
  <a class="nav-link active" href="hs_data.html">HubSpot Data</a>
  <div class="sidebar-bottom">
    <a class="sidebar-home" href="../index.html">← Home</a>
  </div>
</nav>

<div class="main-wrap">
<div class="topbar">
  <span class="topbar-title">HubSpot Data</span>
  <div class="topbar-right">
    <span class="topbar-meta" id="meta"></span>
    <button class="refresh-btn" id="refresh-btn" onclick="triggerRefresh()">↻ Refresh</button>
  </div>
</div>

<div class="matrix-wrap" id="wrap">
  <div class="state" id="state">Loading…</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL  = '[SUPABASE_URL_REMOVED]'
const SUPABASE_ANON = '[SUPABASE_ANON_KEY_REMOVED]'
const db            = supabase.createClient(SUPABASE_URL, SUPABASE_ANON)
const GITHUB_REPO   = 'Robbosd/storage-reporting'
const WORKFLOW_ID   = 'fetch_hs_data.yml'

const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']

function weekLabel(isoSat) {
  const sat = new Date(isoSat + 'T00:00:00')
  const fri = new Date(sat); fri.setDate(fri.getDate() + 6)
  const fmt = d => `${d.getDate()} ${MO[d.getMonth()]}`
  const yearSuffix = sat.getFullYear() !== new Date().getFullYear() ? ` ${sat.getFullYear()}` : ''
  return `${fmt(sat)} – ${fmt(fri)}${yearSuffix}`
}

function fmtN(n) { return n != null ? Number(n).toLocaleString('en-GB') : '—' }

function pctClass(pct) {
  if (pct == null) return ''
  if (pct < 5)  return 'good'
  if (pct < 15) return 'warn'
  return 'bad'
}

let ALL_DATA = []

function render() {
  const wrap = document.getElementById('wrap')
  if (!ALL_DATA.length) {
    wrap.innerHTML = '<div class="state">No data yet — click Refresh to populate</div>'
    return
  }

  const rows = ALL_DATA.map((r, i) => {
    const pct = r.leads_created ? (r.leads_in_new_stage / r.leads_created * 100) : null
    const pctFmt = pct != null ? pct.toFixed(1) + '%' : '—'
    const isLatest = i === 0
    return `
      <tr${isLatest ? ' class="latest"' : ''}>
        <td class="week-cell">
          <div class="week-lbl">${weekLabel(r.week_commencing)}</div>
          ${isLatest ? '<div class="week-sub">Most recent</div>' : ''}
        </td>
        <td class="num">${fmtN(r.leads_created)}</td>
        <td class="num">${fmtN(r.leads_in_new_stage)}</td>
        <td class="pct ${pctClass(pct)}">${pctFmt}</td>
      </tr>`
  }).join('')

  wrap.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Week (Sat – Fri)</th>
          <th class="r">Leads Created</th>
          <th class="r">Still in New Stage</th>
          <th class="r">% Untouched</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`

  const updated = ALL_DATA[0]?.updated_at
  document.getElementById('meta').textContent = updated
    ? `Updated ${new Date(updated).toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'})}`
    : ''
}

async function loadData() {
  const { data, error } = await db
    .from('hs_weekly_stats')
    .select('week_commencing,leads_created,leads_in_new_stage,updated_at')
    .order('week_commencing', { ascending: false })
  if (error) throw error
  ALL_DATA = data || []
}

async function init() {
  try { await loadData() } catch(e) {
    document.getElementById('state').textContent = 'Failed to load data'
    return
  }
  document.getElementById('state').remove()
  render()
}

async function triggerRefresh() {
  const btn = document.getElementById('refresh-btn')
  btn.disabled = true
  btn.innerHTML = '<span class="spin">↻</span> Refreshing…'
  try {
    const dispatch = await fetch(
      `https://storage-dispatch.scottrobinson92.workers.dev/repos/${GITHUB_REPO}/actions/workflows/${WORKFLOW_ID}/dispatches`,
      { method:'POST', headers:{'Authorization':'Bearer worker-handles-auth','Accept':'application/vnd.github.v3+json','Content-Type':'application/json'}, body:JSON.stringify({ref:'main'}) }
    )
    if (!dispatch.ok) throw new Error(`Dispatch failed: ${dispatch.status}`)
    await new Promise(r => setTimeout(r, 5000))
    let runId = null
    for (let i = 0; i < 12; i++) {
      const runs = await fetch(
        `https://storage-dispatch.scottrobinson92.workers.dev/repos/${GITHUB_REPO}/actions/workflows/${WORKFLOW_ID}/runs?per_page=1`,
        { headers:{'Authorization':'Bearer worker-handles-auth','Accept':'application/vnd.github.v3+json'} }
      )
      const d = await runs.json()
      if (d.workflow_runs?.[0]) { runId = d.workflow_runs[0].id; break }
      await new Promise(r => setTimeout(r, 3000))
    }
    if (!runId) throw new Error('Could not find workflow run')
    for (let i = 0; i < 50; i++) {
      await new Promise(r => setTimeout(r, 6000))
      const check = await fetch(
        `https://storage-dispatch.scottrobinson92.workers.dev/repos/${GITHUB_REPO}/actions/runs/${runId}`,
        { headers:{'Authorization':'Bearer worker-handles-auth','Accept':'application/vnd.github.v3+json'} }
      )
      const run = await check.json()
      if (run.status === 'completed') {
        if (run.conclusion !== 'success') throw new Error(`Workflow ${run.conclusion}`)
        break
      }
    }
    await loadData()
    render()
  } catch(e) {
    alert('Refresh failed: ' + e.message)
    console.error(e)
  } finally {
    btn.disabled = false
    btn.innerHTML = '↻ Refresh'
  }
}

init()
</script>
</body>
</html>
