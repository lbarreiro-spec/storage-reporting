name: Send RCS Messages

on:
  workflow_dispatch:
    inputs:
      jobs_json:
        description: 'JSON array of jobs to send'
        required: true
        type: string

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install twilio

      - name: Send messages
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:  ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_RCS_SENDER:  ${{ secrets.TWILIO_RCS_SENDER }}
          JOBS_JSON:          ${{ inputs.jobs_json }}
        run: python3 scripts/send_rcs_messages.py
