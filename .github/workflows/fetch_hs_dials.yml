name: Fetch HubSpot Outbound Dials Monthly

on:
  workflow_dispatch:
  # Scheduled run disabled — report is being reworked for accuracy.
  # Re-enable by uncommenting the schedule block below.
  # schedule:
  #   # 09:00 UTC on the 1st of every month
  #   - cron: '0 9 1 * *'

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dateutil snowflake-connector-python

      - name: Write Snowflake config
        run: |
          mkdir -p ~/.snowflake
          cat > ~/.snowflake/connections.toml << 'EOF'
          [connections.default]
          token = "${{ secrets.SNOWFLAKE_PAT }}"
          EOF

      - name: Run fetch
        run: python3 scripts/fetch_hs_dials.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
