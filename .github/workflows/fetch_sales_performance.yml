name: Fetch Sales Performance

# Manual-trigger only (per the automation policy — no schedule added).
# Refreshes Zoho CRM bookings into Supabase (sales_performance_daily).
# NOTE: the board's "Website lead conversion" no longer runs here — it is now a
# managed Snowflake query (hs_storage_website_lead_cr) the board reads live in
# the browser. GitHub Actions runners can't reach Snowflake (network policy), so
# all HubSpot/Snowflake reads are done client-side via AVDashboard.runQuery.
on:
  workflow_dispatch:

concurrency:
  group: fetch-sales-performance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Write .env
        run: |
          cat > .env << 'EOF'
          ZOHO_CLIENT_ID=${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET=${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN=${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_REGION=eu
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF

      - name: Run fetch (bookings — current + previous month)
        run: python3 scripts/fetch_sales_performance.py
