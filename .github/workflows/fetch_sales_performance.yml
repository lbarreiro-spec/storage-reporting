name: Fetch Sales Performance

# Manual-trigger only (per the automation policy — no schedule added).
on:
  workflow_dispatch:

concurrency:
  group: fetch-sales-performance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Write .env
        run: |
          cat > .env << 'EOF'
          ZOHO_CLIENT_ID=${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET=${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN=${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_REGION=eu
          HUBSPOT_TOKEN=${{ secrets.HUBSPOT_TOKEN }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF

      - name: Run fetch (default window — current + previous month)
        run: python3 scripts/fetch_sales_performance.py

      - name: Run website-lead CR fetch (email-match HubSpot leads ↔ Zoho bookings)
        run: python3 scripts/fetch_website_lead_cr.py
