name: Fetch RCS Jobs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'  # 8am UTC (9am BST / 8am GMT)

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install snowflake-connector-python

      - name: Write Snowflake config
        run: |
          mkdir -p ~/.snowflake
          cat > ~/.snowflake/connections.toml << 'EOF'
          [connections.default]
          token = "${{ secrets.SNOWFLAKE_PAT }}"
          EOF

      - name: Fetch jobs
        run: python3 scripts/fetch_rcs_jobs.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rcs_today.json
          git diff --staged --quiet || git commit -m "RCS jobs for $(date +%Y-%m-%d)"
          git push
