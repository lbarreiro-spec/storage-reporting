<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --mono:'SF Mono','Menlo','Monaco',monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  --navy:#002333; --blue:#41a5dd; --yellow:#ffc907; --link:#106799;
  --green:#16a34a; --red:#dc2626;
}
html,body{height:100%}
body{display:flex;height:100%;font-family:var(--sans);background:#f5f7fa;color:#111827;overflow:hidden}

.sidebar{width:220px;min-width:220px;background:var(--navy);display:flex;flex-direction:column;padding:24px 0;flex-shrink:0;height:100%;overflow-y:auto;border-top:4px solid var(--yellow);z-index:100}
.sidebar-brand{padding:0 24px 24px;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,0.08)}
.sidebar-label{font-size:18px;font-weight:800;letter-spacing:-.02em;color:#fff;margin-bottom:2px}
.sidebar-label span{color:var(--blue)}
.sidebar-title{font-size:12px;font-weight:500;color:rgba(255,255,255,0.55);text-transform:uppercase;letter-spacing:.12em}
.nav-link{display:block;padding:10px 24px;font-size:13px;color:rgba(255,255,255,0.65);text-decoration:none;transition:.12s;border-left:3px solid transparent}
.nav-link:hover{color:rgba(255,255,255,0.85)}
.nav-link.active{color:#fff;border-left-color:var(--blue);background:rgba(65,165,221,0.12)}
.sidebar-bottom{margin-top:auto;padding:16px 24px;border-top:1px solid rgba(255,255,255,0.08)}
.sidebar-home{font-size:13px;color:rgba(255,255,255,0.65);text-decoration:none}
.sidebar-home:hover{color:#fff}

.main-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;gap:14px;padding:16px 28px;border-bottom:1px solid #e2e2e2;background:#fff;flex-shrink:0;z-index:30;flex-wrap:wrap}
.ph-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);font-weight:700;margin-bottom:3px}
.ph-title{font-size:20px;font-weight:700;color:var(--navy);letter-spacing:-.01em;line-height:1}
.topbar-meta{font-size:12px;color:#6b7280;font-family:var(--mono)}
.topbar-spacer{flex:1}
.btn{font-size:13px;font-family:var(--mono);color:#6b7280;background:#fff;border:1px solid #e2e2e2;border-radius:6px;padding:5px 11px;cursor:pointer;transition:.12s}
.btn:hover:not(:disabled){color:var(--link);border-color:var(--blue)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.primary:hover:not(:disabled){background:#013049}
.linkbtn{background:none;border:none;color:var(--link);font-size:12px;cursor:pointer;padding:0;font-family:var(--sans)}
.linkbtn:hover{text-decoration:underline}
.mstep{display:flex;align-items:center;gap:4px}
.mnav{font-size:13px;font-family:var(--mono);color:#6b7280;background:#fff;border:1px solid #d7dde3;border-radius:7px;padding:6px 11px;cursor:pointer;transition:.12s}
.mnav:hover:not(:disabled){color:var(--link);border-color:var(--blue)}
.mnav:disabled{opacity:.35;cursor:default}
.mlabel{min-width:118px;text-align:center;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--navy)}

.scroll{flex:1;overflow-y:auto;padding:24px 28px 60px}
.layout{display:grid;grid-template-columns:360px 1fr;gap:24px;align-items:start;max-width:1500px}
@media(max-width:1100px){.layout{grid-template-columns:1fr}}

.card{background:#fff;border:1px solid #e7ebef;border-radius:12px;box-shadow:0 1px 2px rgba(0,35,51,.04)}
.card-hd{padding:16px 20px;border-bottom:1px solid #eef2f5;display:flex;align-items:center;gap:10px}
.card-hd h2{font-size:14px;font-weight:700;color:var(--navy);letter-spacing:-.01em}
.card-hd .sub{font-size:11px;color:#9ca3af;font-family:var(--mono);margin-left:auto}
.card-bd{padding:18px 20px}

.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#6b7280;margin-bottom:5px}
.field .hint{font-weight:400;text-transform:none;letter-spacing:0;color:#b3bcc4;font-size:10px}
.field input,.field select{width:100%;font-family:var(--sans);font-size:14px;color:#111827;background:#fff;border:1px solid #d7dde3;border-radius:8px;padding:9px 11px;outline:none;transition:.12s}
.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(65,165,221,.15)}
.rep-row{display:flex;align-items:center;gap:8px}
.rep-row select{flex:1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.preview{margin-top:4px;background:#f7fafc;border:1px solid #e7ebef;border-radius:10px;padding:14px 16px}
.pv-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;padding:3px 0;color:#6b7280}
.pv-row .v{font-family:var(--mono);color:#374151;font-size:12px}
.pv-total{margin-top:8px;padding-top:10px;border-top:1px solid #e2e8ee;display:flex;justify-content:space-between;align-items:baseline}
.pv-total .lbl{font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.06em}
.pv-total .v{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--green)}
.pv-total .gbp{font-size:11px;color:#9ca3af;font-family:var(--mono)}
.form-msg{font-size:12px;margin-top:10px;min-height:16px}
.form-msg.ok{color:var(--green)} .form-msg.err{color:var(--red)}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
@media(max-width:1300px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:#fff;border:1px solid #e7ebef;border-radius:12px;padding:14px 16px}
.tile .t-lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#9ca3af;font-weight:700;margin-bottom:6px}
.tile .t-val{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--navy)}
.tile .t-sub{font-size:11px;color:#9ca3af;font-family:var(--mono);margin-top:2px}

.tabs{display:flex;gap:6px;margin-bottom:14px;align-items:center}
.tab{font-size:12px;font-family:var(--mono);color:#6b7280;background:#fff;border:1px solid #e2e2e2;border-radius:7px;padding:6px 13px;cursor:pointer;transition:.12s}
.tab:hover{border-color:var(--blue);color:var(--link)}
.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.t-search{margin-left:auto;font-family:var(--mono);font-size:12px;border:1px solid #e2e2e2;border-radius:7px;padding:6px 10px;outline:none;width:180px}
.t-search:focus{border-color:var(--blue)}

.panel{background:#fff;border:1px solid #e7ebef;border-radius:12px;padding:18px 20px;margin-bottom:20px}
.panel-hd{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.panel-hd h3{font-size:14px;font-weight:700;color:var(--navy)}
.panel-hd .sub{font-size:11px;color:#9ca3af;font-family:var(--mono);margin-left:auto}
.chart-box{position:relative;width:100%}

table{border-collapse:collapse;width:100%;font-size:13px;background:#fff}
thead th{position:sticky;top:0;background:#eef4f8;color:var(--navy);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:right;padding:9px 12px;border-bottom:1px solid #d8e6ef;white-space:nowrap}
thead th.l{text-align:left}
tbody td{padding:9px 12px;border-bottom:1px solid #f1f4f6;text-align:right;font-family:var(--mono);color:#374151;white-space:nowrap}
tbody td.l{text-align:left;font-family:var(--sans);color:#111827}
tbody tr:hover td{background:#fafcfd}
tbody td.pay{font-weight:700;color:var(--green)}
tbody tr.void td{color:#c4c9ce;text-decoration:line-through}
tbody tr.void td.pay{color:#c4c9ce}
.row-act{cursor:pointer;color:#c0c6cc;font-family:var(--mono)}
.row-act:hover{color:var(--red)}
tr.grp td{background:#f4f8fb;font-weight:700;color:var(--navy)}
.rank{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#eef4f8;color:var(--link);font-size:11px;font-weight:700;font-family:var(--mono)}
.rank.r1{background:var(--yellow);color:#5a4500} .rank.r2{background:#dce3e8;color:#3a4a55} .rank.r3{background:#f0d9c2;color:#7a4a1e}
.pill{display:inline-block;font-size:10px;font-family:var(--mono);background:#eef4f8;color:var(--link);border-radius:5px;padding:2px 6px}
.mom{font-size:11px;font-family:var(--mono)} .mom.up{color:var(--green)} .mom.down{color:var(--red)} .mom.flat{color:#9ca3af}
.spark-cell{padding:6px 12px}
.empty-state{padding:40px;text-align:center;color:#9ca3af;font-size:13px}
.tbl-wrap{border:1px solid #e7ebef;border-radius:12px;overflow:hidden}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#cfe3f0;border-radius:3px}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<nav class="sidebar">
  <div class="sidebar-brand">
    <div class="sidebar-label">Any<span>Van</span></div>
    <div class="sidebar-title">Storage Reporting</div>
  </div>
  <a class="nav-link active" href="/operations/storage-commission">Commission</a>
  <div class="sidebar-bottom"><a class="sidebar-home" href="/operations/storage">← All boards (Hub)</a></div>
</nav>

<div class="main-wrap">
<div class="topbar">
  <div><div class="ph-lbl">Storage · Sales</div><div class="ph-title">Commission</div></div>
  <div class="topbar-spacer"></div>
  <div class="mstep">
    <button class="mnav" id="m-prev" onclick="stepMonth(-1)" title="Previous month">◀</button>
    <span class="mlabel" id="m-label">—</span>
    <button class="mnav" id="m-next" onclick="stepMonth(1)" title="Next month">▶</button>
  </div>
  <button class="btn" id="refresh-btn" onclick="loadAll()">↻ Refresh</button>
  <span class="topbar-meta" id="meta">Loading…</span>
</div>

<div class="scroll">
  <div class="tiles" id="tiles"></div>

  <div class="layout">
    <!-- FORM -->
    <div class="card" id="form-card">
      <div class="card-hd"><h2>New submission</h2><span class="sub">payout auto-calculated</span></div>
      <div class="card-bd">
        <div class="field">
          <label>Submitted by</label>
          <div class="rep-row">
            <select id="f-rep"></select>
            <button class="btn" title="Add a new rep" onclick="addRep()" style="padding:8px 10px">＋</button>
          </div>
        </div>
        <div class="field"><label>Listing ID</label><input id="f-listing" inputmode="numeric" placeholder="e.g. 9242767" autocomplete="off"></div>
        <div class="row2">
          <div class="field"><label>Month booked</label><select id="f-month"></select></div>
          <div class="field"><label>Length <span class="hint">weeks</span></label><input id="f-weeks" inputmode="decimal" placeholder="e.g. 12" autocomplete="off"></div>
        </div>
        <div class="row2">
          <div class="field"><label>Weekly invoice <span class="hint">£ /wk</span></label><input id="f-weekly" inputmode="decimal" placeholder="e.g. 47.98" autocomplete="off"></div>
          <div class="field"><label>AnyVan fee <span class="hint">£ inc-VAT</span></label><input id="f-fee" inputmode="decimal" placeholder="e.g. 595.00" autocomplete="off"></div>
        </div>
        <div class="preview">
          <div class="pv-row"><span>Months in storage <span class="hint">(cap 9)</span></span><span class="v" id="pv-months">—</span></div>
          <div class="pv-row"><span>Invoice cap tier</span><span class="v" id="pv-tier">—</span></div>
          <div class="pv-row"><span>Payout rate</span><span class="v" id="pv-pct">—</span></div>
          <div class="pv-row"><span>AnyVan-fee payout</span><span class="v" id="pv-feepay">—</span></div>
          <div class="pv-row"><span>Invoice payout</span><span class="v" id="pv-invpay">—</span></div>
          <div class="pv-total"><span class="lbl">Collective payout</span><span><span class="v" id="pv-total">R0.00</span><br><span class="gbp" id="pv-gbp"></span></span></div>
        </div>
        <button class="btn primary" id="submit-btn" style="width:100%;margin-top:14px;padding:10px" onclick="submitRow()">Submit booking</button>
        <div class="form-msg" id="form-msg"></div>
      </div>
    </div>

    <!-- DATA -->
    <div>
      <div class="tabs">
        <div class="tab active" data-view="board" onclick="setView('board')">Leaderboard</div>
        <div class="tab" data-view="trends" onclick="setView('trends')">Trends</div>
        <div class="tab" data-view="recent" onclick="setView('recent')">Submissions</div>
      </div>
      <div id="data"></div>
    </div>
  </div>
</div>
</div>

<script>
/* ================= Supabase ================= */
const SUPABASE_URL='https://loyvicdabsncwhssjkxy.supabase.co'
const SUPABASE_ANON_KEY='sb_publishable_QWQOo0CWifid4QyyRzRYvQ_P5DP8ecZ'
const TABLE='commission_submissions', REPS_TABLE='commission_reps'
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)

/* ================= Config ================= */
const FX=20, AV_FEE_RATE=0.05, MONTH_CAP=9
const PALETTE=['#41a5dd','#002333','#ffc907','#16a34a','#9333ea','#ef4444','#0891b2','#f59e0b','#64748b','#db2777']

/* ================= Commission maths (live = 1.5%-base matrix; bugs fixed) ================= */
function tierFor(w){ return w>0?Math.min(100,Math.ceil(w/25)*25):0 }
function monthsFor(w){ return w>0?Math.min(MONTH_CAP,Math.ceil(w/4.33)):0 }
function pctFor(m,t){ const i={25:0,50:1,75:2,100:3}[t]; return (i===undefined||m<1)?0:0.015+(m-1)*0.001+i*0.005 }
function calc(weeks,weekly,fee){
  const m=monthsFor(weeks), t=tierFor(weekly), pct=pctFor(m,t)
  const capInv=m*4.3*(weekly||0), mk=t===100?m*1000+100:m*100+t
  const feeP=((fee||0)/1.2)*AV_FEE_RATE*FX, invP=pct*capInv*FX
  return {months:m,tier:t,pct,matchKey:mk,cappedInvoice:capInv,feePayout:feeP,invPayout:invP,collective:invP+feeP,contractGbp:(weeks||0)*(weekly||0)+(fee||0)}
}
const round2=n=>Math.round((n||0)*100)/100
const fmtR=n=>'R'+(n||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})
const fmtR0=n=>'R'+Math.round(n||0).toLocaleString('en-GB')
const fmtGbp=n=>'£'+(n||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

const MN={january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12}
function monthOrd(s){const p=String(s).trim().split(/\s+/);return (parseInt(p[1])||0)*100+(MN[(p[0]||'').toLowerCase()]||0)}
function monthShort(s){const p=String(s).trim().split(/\s+/);const m=Object.keys(MN).find(k=>MN[k]===MN[(p[0]||'').toLowerCase()]);return (p[0]||'').slice(0,3)+(p[1]?" '"+String(p[1]).slice(2):'')}

/* ================= Form ================= */
let REPS=[]
function num(id){const v=parseFloat(String(document.getElementById(id).value).replace(/[£,\s]/g,''));return isNaN(v)?0:v}
function updatePreview(){
  const c=calc(num('f-weeks'),num('f-weekly'),num('f-fee'))
  document.getElementById('pv-months').textContent=c.months||'—'
  document.getElementById('pv-tier').textContent=c.tier?c.tier+(c.tier===100?'+':''):'—'
  document.getElementById('pv-pct').textContent=c.pct?(c.pct*100).toFixed(1)+'%':'—'
  document.getElementById('pv-feepay').textContent=fmtR(c.feePayout)
  document.getElementById('pv-invpay').textContent=fmtR(c.invPayout)
  document.getElementById('pv-total').textContent=fmtR(c.collective)
  document.getElementById('pv-gbp').textContent=c.contractGbp?'contract value '+fmtGbp(c.contractGbp):''
}
['f-weeks','f-weekly','f-fee'].forEach(id=>document.addEventListener('input',e=>{if(e.target.id===id)updatePreview()}))

async function loadReps(){
  const {data}=await db.from(REPS_TABLE).select('name').eq('active',true).order('sort_order')
  REPS=(data||[]).map(r=>r.name)
  const sel=document.getElementById('f-rep'), cur=sel.value
  sel.innerHTML=REPS.map(r=>`<option>${esc(r)}</option>`).join('')
  if(cur && REPS.includes(cur)) sel.value=cur
}
async function addRep(){
  const name=(prompt('New rep full name (as it should appear on payouts):')||'').trim()
  if(!name) return
  if(REPS.includes(name)){ alert('That rep already exists.'); return }
  const next=(REPS.length+1)*10+10
  const {error}=await db.from(REPS_TABLE).upsert({name,active:true,sort_order:next},{onConflict:'name'})
  if(error){ alert('Failed to add rep: '+(error.message||error)); return }
  await loadReps(); document.getElementById('f-rep').value=name
}

async function submitRow(){
  const msg=document.getElementById('form-msg'); msg.className='form-msg'; msg.textContent=''
  const rep=document.getElementById('f-rep').value
  const listing=document.getElementById('f-listing').value.trim()
  const month=document.getElementById('f-month').value
  const weeks=num('f-weeks'),weekly=num('f-weekly'),fee=num('f-fee')
  const fail=t=>{msg.className='form-msg err';msg.textContent=t}
  if(!rep) return fail('Pick a rep')
  if(!listing) return fail('Enter a Listing ID')
  if(!(weeks>0)) return fail('Enter the length in weeks')
  if(!(weekly>0)) return fail('Enter the weekly invoice cost')
  if(!(fee>0)) return fail('Enter the AnyVan fee')
  const c=calc(weeks,weekly,fee)
  const btn=document.getElementById('submit-btn'); btn.disabled=true; btn.innerHTML='<span class="spin">↻</span> Saving…'
  try{
    const {error}=await db.from(TABLE).insert({listing_id:listing,month_booked:month,weeks,weekly_invoice:weekly,av_fee:fee,rep,
      months_in_storage:c.months,invoice_cap:c.tier,match_key:c.matchKey,invoice_pct:c.pct,
      av_fee_payout_zar:round2(c.feePayout),invoice_payout_zar:round2(c.invPayout),collective_payout_zar:round2(c.collective),
      contract_value_gbp:round2(c.contractGbp),fx_rate:FX,status:'active'})
    if(error) throw error
    msg.className='form-msg ok'; msg.textContent='✓ Saved — '+fmtR(c.collective)+' to '+rep
    ;['f-listing','f-weeks','f-weekly','f-fee'].forEach(id=>document.getElementById(id).value='')
    updatePreview(); await loadAll()
  }catch(e){ msg.className='form-msg err'; msg.textContent='Save failed: '+(e.message||e) }
  finally{ btn.disabled=false; btn.textContent='Submit booking' }
}
async function voidRow(id,label){
  if(!confirm('Void this submission?\n\n'+label+'\n\nExcluded from all totals (kept for audit).')) return
  const {error}=await db.from(TABLE).update({status:'void'}).eq('id',id)
  if(error){ alert('Failed: '+(error.message||error)); return }
  await loadAll()
}

/* ================= State / load ================= */
let ROWS=[], VIEW='board'
let MNAV=[], mIdx=0          // month stepper: MNAV = chronological months, mIdx = selected
let chartMain=null, chartTrend=null
function curMonth(){ return MNAV[mIdx]||'' }
function setView(v){ VIEW=v; document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===v)); renderData() }
function stepMonth(d){ const n=mIdx+d; if(n<0||n>=MNAV.length) return; mIdx=n; updateStepper(); renderTiles(); renderData() }
function updateStepper(){ document.getElementById('m-label').textContent=curMonth()||'—'; document.getElementById('m-prev').disabled=mIdx<=0; document.getElementById('m-next').disabled=mIdx>=MNAV.length-1 }
function activeRows(){ return ROWS.filter(r=>r.status!=='void') }
function inMonth(r){ return (r.month_booked||'')===curMonth() }
function scopeRows(){ return activeRows().filter(inMonth) }
function months(){ return [...new Set(activeRows().map(r=>r.month_booked||'').filter(Boolean))].sort((a,b)=>monthOrd(a)-monthOrd(b)) }
/* months from earliest submission → current calendar month (so July appears the moment it starts) */
function buildMonthNav(){
  const ms=months(), now=new Date(), curOrd=now.getFullYear()*100+(now.getMonth()+1)
  const startOrd=ms.length?Math.min(monthOrd(ms[0]),curOrd):curOrd
  const out=[]; let y=Math.floor(startOrd/100), m=startOrd%100
  while(y*100+m<=curOrd){ out.push(new Date(y,m-1,1).toLocaleDateString('en-GB',{month:'long'})+' '+y); m++; if(m>12){m=1;y++} }
  return out
}
const sumPay=g=>g.reduce((s,r)=>s+(+r.collective_payout_zar||0),0)

async function loadAll(){
  const btn=document.getElementById('refresh-btn'); btn.disabled=true
  try{
    const {data,error}=await db.from(TABLE).select('*').order('submitted_at',{ascending:false}).limit(5000)
    if(error) throw error
    ROWS=data||[]
  }catch(e){ document.getElementById('data').innerHTML='<div class="empty-state">Failed to load: '+(e.message||e)+'</div>' }
  finally{ btn.disabled=false }
  await loadReps()
  const prevLabel=MNAV.length?curMonth():null
  MNAV=buildMonthNav()
  // keep the user on the same month across refresh; otherwise land on the latest (current) month
  const keep=prevLabel?MNAV.indexOf(prevLabel):-1
  mIdx=keep>=0?keep:MNAV.length-1
  updateStepper()
  renderTiles(); renderData()
}

function renderTiles(){
  const a=scopeRows()
  const totR=sumPay(a), totGbp=a.reduce((s,r)=>s+(+r.contract_value_gbp||0),0)
  const reps=new Set(a.map(r=>r.rep)).size
  const label=curMonth()
  const top=[...a.reduce((m,r)=>m.set(r.rep,(m.get(r.rep)||0)+(+r.collective_payout_zar||0)),new Map())].sort((x,y)=>y[1]-x[1])[0]
  const t=[
    [label+' payout',fmtR0(totR),a.length+' bookings'],
    ['Top earner',top?top[0].split(' ')[0]:'—',top?fmtR0(top[1]):''],
    ['Reps in view',reps,label],
    ['Avg / booking',fmtR0(a.length?totR/a.length:0),'per booking']
  ]
  document.getElementById('tiles').innerHTML=t.map(x=>`<div class="tile"><div class="t-lbl">${x[0]}</div><div class="t-val">${x[1]}</div><div class="t-sub">${x[2]}</div></div>`).join('')
  const all=activeRows()
  document.getElementById('meta').textContent=all.length+' bookings · '+fmtR0(sumPay(all))+' all-time · updated '+new Date().toLocaleDateString('en-GB')
}

function destroyCharts(){ if(chartMain){chartMain.destroy();chartMain=null} if(chartTrend){chartTrend.destroy();chartTrend=null} }
function emptyState(el,msg){ el.innerHTML='<div class="panel"><div class="empty-state">'+(msg||'Nothing to show.')+'</div></div>' }

function renderData(){
  destroyCharts()
  const el=document.getElementById('data')
  if(VIEW==='board') return renderBoard(el)
  if(VIEW==='trends') return renderTrends(el)
  if(VIEW==='recent') return renderRecent(el)
}

/* ---------- LEADERBOARD (month-scoped: ranked bars + table) ---------- */
function renderBoard(el){
  const scopeLabel=curMonth()
  const a=scopeRows()
  // every active rep appears (even at 0), so new reps show immediately
  const map=new Map(REPS.map(r=>[r,{rep:r,n:0,pay:0,gbp:0}]))
  a.forEach(r=>{ if(!map.has(r.rep)) map.set(r.rep,{rep:r.rep,n:0,pay:0,gbp:0}); const o=map.get(r.rep); o.n++; o.pay+=+r.collective_payout_zar||0; o.gbp+=+r.contract_value_gbp||0 })
  const ranked=[...map.values()].sort((x,y)=>y.pay-x.pay)
  el.innerHTML=`
    <div class="panel">
      <div class="panel-hd"><h3>Commission leaderboard</h3><span class="sub">${esc(scopeLabel)}</span></div>
      <div class="chart-box" style="height:${Math.max(160,ranked.length*46)}px"><canvas id="cMain"></canvas></div>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th class="l">#</th><th class="l">Rep</th><th>Bookings</th><th>Contract £</th><th>Avg / booking</th><th>Payout</th></tr></thead>
      <tbody>${ranked.map((o,i)=>`<tr>
        <td class="l"><span class="rank r${i+1}">${i+1}</span></td>
        <td class="l">${esc(o.rep)}</td>
        <td>${o.n}</td>
        <td>${fmtGbp(o.gbp)}</td>
        <td>${o.n?fmtR(o.pay/o.n):'—'}</td>
        <td class="pay">${fmtR(o.pay)}</td></tr>`).join('')}
        <tr class="grp"><td></td><td class="l">TOTAL</td><td>${ranked.reduce((s,o)=>s+o.n,0)}</td><td>${fmtGbp(ranked.reduce((s,o)=>s+o.gbp,0))}</td><td></td><td>${fmtR(ranked.reduce((s,o)=>s+o.pay,0))}</td></tr>
      </tbody></table></div>`
  const ctx=document.getElementById('cMain')
  chartMain=new Chart(ctx,{type:'bar',data:{labels:ranked.map(o=>o.rep),datasets:[{data:ranked.map(o=>Math.round(o.pay)),backgroundColor:ranked.map((o,i)=>i===0?'#ffc907':'#41a5dd'),borderRadius:5,barThickness:24}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmtR(c.raw)}}},
      scales:{x:{ticks:{callback:v=>'R'+(v/1000)+'k',font:{family:"'SF Mono',monospace",size:10},color:'#9ca3af'},grid:{color:'#f0f0f0'}},y:{ticks:{font:{size:12},color:'#374151'},grid:{display:false}}}}})
}

/* ---------- TRENDS (per-rep sparkline rows + team monthly total) ---------- */
function sparkBars(vals,max){
  const W=140,H=30,n=vals.length,gap=2,bw=n?(W-gap*(n-1))/n:W
  let bars=''
  vals.forEach((v,i)=>{ const h=max>0?Math.max(1,(v/max)*(H-2)):1; const x=i*(bw+gap); bars+=`<rect x="${x.toFixed(1)}" y="${(H-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="1" fill="${i===n-1?'#002333':'#9fcde9'}"/>` })
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${bars}</svg>`
}
function renderTrends(el){
  const ms=months()
  if(!ms.length) return emptyState(el,'No submissions yet.')
  // per-rep monthly payout
  const reps=new Map(REPS.map(r=>[r,ms.map(()=>0)]))
  activeRows().forEach(r=>{ const idx=ms.indexOf(r.month_booked); if(idx<0)return; if(!reps.has(r.rep)) reps.set(r.rep,ms.map(()=>0)); reps.get(r.rep)[idx]+=+r.collective_payout_zar||0 })
  const rows=[...reps.entries()].map(([rep,vals])=>({rep,vals,total:vals.reduce((a,b)=>a+b,0),latest:vals[vals.length-1],prev:vals[vals.length-2]||0})).sort((a,b)=>b.total-a.total)
  const max=Math.max(1,...rows.flatMap(r=>r.vals))
  const monTotals=ms.map((m,i)=>rows.reduce((s,r)=>s+r.vals[i],0))
  const momCell=r=>{ if(ms.length<2) return '<span class="mom flat">—</span>'; if(r.prev===0) return r.latest>0?'<span class="mom up">▲ new</span>':'<span class="mom flat">—</span>'; const d=(r.latest-r.prev)/r.prev*100; const c=d>0.5?'up':d<-0.5?'down':'flat'; const ar=d>0.5?'▲':d<-0.5?'▼':'▬'; return `<span class="mom ${c}">${ar} ${Math.abs(d).toFixed(0)}%</span>` }
  el.innerHTML=`
    <div class="panel">
      <div class="panel-hd"><h3>Team payout by month</h3><span class="sub">${ms.length} month${ms.length>1?'s':''}</span></div>
      <div class="chart-box" style="height:240px"><canvas id="cTrend"></canvas></div>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th class="l">Rep</th><th class="l">Trend (per month)</th><th>${esc(monthShort(ms[ms.length-1]))}</th><th>MoM</th><th>Total</th></tr></thead>
      <tbody>${rows.map(r=>`<tr>
        <td class="l">${esc(r.rep)}</td>
        <td class="l spark-cell">${sparkBars(r.vals,max)}</td>
        <td>${r.latest?fmtR0(r.latest):'—'}</td>
        <td>${momCell(r)}</td>
        <td class="pay">${fmtR0(r.total)}</td></tr>`).join('')}
        <tr class="grp"><td class="l">TEAM</td><td class="l spark-cell">${sparkBars(monTotals,Math.max(1,...monTotals))}</td><td>${fmtR0(monTotals[monTotals.length-1])}</td><td></td><td>${fmtR0(monTotals.reduce((a,b)=>a+b,0))}</td></tr>
      </tbody></table></div>`
  const ctx=document.getElementById('cTrend')
  chartTrend=new Chart(ctx,{type:'bar',data:{labels:ms.map(monthShort),datasets:[{data:monTotals.map(Math.round),backgroundColor:'#41a5dd',borderRadius:5,maxBarThickness:54}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmtR(c.raw)}}},
      scales:{y:{ticks:{callback:v=>'R'+(v/1000)+'k',font:{family:"'SF Mono',monospace",size:10},color:'#9ca3af'},grid:{color:'#f0f0f0'}},x:{ticks:{font:{size:11},color:'#374151'},grid:{display:false}}}}})
}

/* ---------- SUBMISSIONS (raw list, month + search scoped) ---------- */
function renderRecent(el){
  const rows=ROWS.filter(inMonth)
  if(!rows.length) return emptyState(el,'No submissions for this month.')
  el.innerHTML=`<div class="tbl-wrap"><table>
    <thead><tr><th class="l">Date</th><th class="l">Rep</th><th class="l">Listing</th><th class="l">Month</th><th>Wks</th><th>£/wk</th><th>Fee £</th><th>Mo</th><th>Tier</th><th>Rate</th><th>Payout</th><th></th></tr></thead>
    <tbody>${rows.map(r=>{const d=(r.submitted_at||'').slice(0,10);const lbl=`${r.rep} · ${r.listing_id} · ${fmtR(+r.collective_payout_zar)}`;return `<tr class="${r.status==='void'?'void':''}">
      <td class="l">${d}</td><td class="l">${esc(r.rep)}</td><td class="l"><span class="pill">${esc(r.listing_id)}</span></td><td class="l">${esc(r.month_booked||'')}</td>
      <td>${(+r.weeks)%1?(+r.weeks).toFixed(2):+r.weeks}</td><td>${fmtGbp(+r.weekly_invoice)}</td><td>${fmtGbp(+r.av_fee)}</td>
      <td>${r.months_in_storage??''}</td><td>${r.invoice_cap??''}${r.invoice_cap===100?'+':''}</td><td>${r.invoice_pct?(r.invoice_pct*100).toFixed(1)+'%':''}</td>
      <td class="pay">${fmtR(+r.collective_payout_zar)}</td>
      <td>${r.status==='void'?'':`<span class="row-act" title="Void" onclick="voidRow('${r.id}','${esc(lbl).replace(/'/g,'&#39;')}')">✕</span>`}</td></tr>`}).join('')}
    </tbody></table></div>`
}

/* ================= Init ================= */
function initMonths(){
  const out=[],now=new Date()
  for(let i=0;i<13;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1);out.push(d.toLocaleDateString('en-GB',{month:'long'})+' '+d.getFullYear())}
  document.getElementById('f-month').innerHTML=out.map((m,i)=>`<option ${i===0?'selected':''}>${m}</option>`).join('')
}
initMonths(); updatePreview(); loadAll()
